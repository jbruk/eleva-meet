version: 0.2

env:
  variables:
    CI: "true"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Using Node version:"
      - node --version
      - npm --version
      # Only install extra libs if really required
      - apt-get update -y
      - apt-get install -y libpng-dev
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm ci --no-audit --no-fund
  build:
    commands:
      - echo "Building Jitsi Meet..."
      - make all
  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - '**/*'
  base-directory: .
  discard-paths: no

cache:
  paths:
    - '/root/.npm/**/*'
